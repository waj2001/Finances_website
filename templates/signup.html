
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup  Page</title>
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <div class="signup_box">
        <h1>Signup page</h1>
        <form action="/signup/" method="post">
            {% csrf_token %}
            <label for="n1">First_name</label>
            <input type="text" placeholder="Enter First Name" name="First_name">
            <label for="n2">Last_name</label>
            <input type="text" placeholder="Enter Last Name" name="Last_name">
            <label for="n3">username</label>
            <input type="text" placeholder="Enter User Name" name="username">
            <label for="n4">Email</label>
            <input type="email" placeholder="Enter Email" name="Email">
            <label for="n5">Password</label>
            <input type="password" placeholder="Enter password" name="Password1">
            <label for="n6">Confirm_password</label>
            <input type="password" placeholder="Enter confirm password" name="Password2">
            <input type="submit" value="submit" class="btn1">

        </form>

        {% if messages %}
           {% for i in messages %}
              <h1>{{i}}</h1>
           {% endfor %}
        {% endif %}
    </div>
</body>
</html>
